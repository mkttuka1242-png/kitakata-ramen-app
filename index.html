<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f1e8">
  <title>喜多方ラーメン巡り</title>
<link rel="stylesheet" href="style.css">
 
</head>

<body>
  <main class="app">
    <h1>🍜 喜多方ラーメン巡りアプリ 🍜</h1>
    <p class="note">店舗をタップすると訪問済みになります。もう一度タップすると解除できます。</p>

    <section class="summary" aria-live="polite">
      <span id="count">訪問済み 0 / 95 店</span>
      <span id="percent">制覇率 0%</span>
    </section>
 <button id="share-x-top" type="button">Xにポスト</button>
 <button id="share-facebook-top" type="button">Facebookでシェア</button>
<button id="share-threads-top" type="button">Threadsでシェア</button> 
<input id="shop-search" type="search" placeholder="店舗名を検索">
<select id="area-filter">
  <option value="all">すべての地域</option>
<option value="喜多方（市街地）">喜多方（市街地）</option>
<option value="喜多方（松山町）">喜多方（松山町）</option>
<option value="喜多方（岩月町）">喜多方（岩月町）</option>
<option value="喜多方（熊倉町）">喜多方（熊倉町）</option>
<option value="喜多方（関柴町）">喜多方（関柴町）</option>
<option value="喜多方（豊川町）">喜多方（豊川町）</option>
<option value="熱塩加納町">熱塩加納町</option>
<option value="塩川町">塩川町</option>
<option value="山都町">山都町</option>
<option value="高郷町">高郷町</option>
</select>
<div class="filters">
  <div id="result-count">該当店舗：95店</div>
  <button id="filter-all"  class="active" type="button">すべて</button>
  <button id="filter-visited" type="button">訪問済み</button>
  <button id="filter-unvisited" type="button">未訪問</button>
  <button id="filter-open">🕐 今やってる店舗</button>
</div>
<div class="hours-notice">
  <strong>🕐 営業時間について</strong>
  <p>
    掲載している営業時間は、公式情報や各種公開情報をもとに当サイトで確認した参考情報です。<br>
    臨時休業・営業時間の変更・スープや材料がなくなり次第終了する場合があります。ご来店前に店舗の最新情報をご確認ください。
  </p>
</div>
    <section id="shops" aria-label="ラーメン店一覧"></section>

    <div class="actions">
      <button id="reset" class="reset" type="button">すべての訪問チェックを解除</button>
    </div>
  <button id="share-x" type="button">Xにポスト</button>
  </main>

 <script src="shops.js"></script>  


  <script src="app.js"></script>
</body>
</html>
