<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f1e8">
  <title>喜多方ラーメン巡り</title>
<link rel="stylesheet" href="style.css">
 
</head>

<body>
  <main class="app">
    <h1>🍜 喜多方ラーメン巡りアプリ 🍜</h1>
    <p class="note">店舗をタップすると訪問済みになります。もう一度タップすると解除できます。</p>

    <section class="summary" aria-live="polite">
      <span id="count">訪問済み 0 / 95 店</span>
      <span id="percent">制覇率 0%</span>
    </section>

    <section id="shops" aria-label="ラーメン店一覧"></section>

    <div class="actions">
      <button id="reset" class="reset" type="button">すべての訪問チェックを解除</button>
    </div>
  </main>

 <script src="shops.js"></script>  


  <script src="app.js"></script>
</body>
</html>
